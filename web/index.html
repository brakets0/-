<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工考勤系统 | Employee Attendance</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="ambient-layer" aria-hidden="true"></div>
    <div class="grid-overlay"></div>

    <div id="login-view" class="login-shell">
        <main class="login-panel glass">
            <div class="login-left">
                <div class="brand-mark">
                    <div class="brand-icon"></div>
                    <div>
                        <p class="brand-eyebrow">employee attendance</p>
                        <h1>员工考勤系统</h1>
                    </div>
                </div>
                <p class="brand-copy">深色霓虹视觉 · 部门与总管理员双入口 · 人脸打卡与智能报表同步协同</p>
                <div class="login-stats">
                    <span>实时考勤</span><span>智能审批</span><span>月度报表</span>
                </div>
            </div>
            <div class="login-right">
                <div class="login-heading">
                    <span class="status-dot"></span>
                    <span>账号登录</span>
                </div>
                <p class="login-sub">欢迎回来，请登录管理台</p>
                <form id="login-form" autocomplete="off">
                    <label class="field">
                        <span>用户名</span>
                        <div class="input-wrap">
                            <input id="login-username" name="username" maxlength="50" placeholder="请输入用户名" required>
                            <span class="input-glow"></span>
                        </div>
                    </label>
                    <label class="field">
                        <span>密码</span>
                        <div class="input-wrap">
                            <input id="login-password" name="password" type="password" maxlength="128" placeholder="请输入密码" required>
                            <span class="input-glow"></span>
                        </div>
                    </label>
                    <p id="login-error" class="form-error" role="alert"></p>
                    <button id="login-button" class="btn btn-primary" type="submit">
                        <span>登录管理台</span>
                        <span class="btn-shine"></span>
                    </button>
                </form>
                <div class="demo-accounts">
                    <span>演示账号</span>
                    <button class="account-chip" data-username="admin" data-password="admin123">总管理员 admin</button>
                    <button class="account-chip" data-username="manager" data-password="manager123">部门管理员 manager</button>
                    <button class="account-chip" data-username="employee" data-password="employee123">员工 employee</button>
                </div>
            </div>
        </main>
    </div>

    <div id="app-view" class="app-shell hidden">
        <aside class="sidebar glass">
            <div class="sidebar-brand">
                <div class="brand-icon small"></div>
                <div>
                    <p class="brand-eyebrow">employee attendance</p>
                    <strong>员工考勤系统</strong>
                </div>
            </div>
            <nav class="side-nav" id="side-nav"></nav>
            <div class="sidebar-user">
                <div class="avatar" id="user-avatar">A</div>
                <div class="sidebar-user-text">
                    <strong id="user-name">管理员</strong>
                    <span id="user-role">角色</span>
                </div>
                <button class="icon-btn logout-btn" id="logout-button" title="退出登录" aria-label="退出登录">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </aside>

        <main class="content">
            <header class="topbar">
                <div>
                    <p class="topbar-kicker">ATTENDANCE CONSOLE</p>
                    <h2 id="page-title">工作台</h2>
                </div>
                <div class="topbar-actions">
                    <span class="topbar-time" id="live-time"></span>
                    <button class="icon-btn" id="refresh-button" title="刷新数据" aria-label="刷新数据">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    </button>
                </div>
            </header>
            <section id="page-content" class="page-content"></section>
        </main>
    </div>

    <div id="toast-wrap" class="toast-wrap"></div>
    <script src="app.js"></script>
</body>
</html>
